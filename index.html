<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>Teacher's Pet</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#192b42;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e6ebf1;padding:18px max(20px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0;letter-spacing:-.5px}.mark{width:36px;height:36px;border-radius:11px;background:#173d65;color:#fff;display:grid;place-items:center;font-weight:800}.brand{display:flex;align-items:center;gap:12px}main{max-width:850px;margin:auto;padding:25px 18px 80px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.3px;color:#687c93;text-transform:uppercase;margin-bottom:7px}h2{font-size:28px;letter-spacing:-.8px;margin:0 0 7px}p{color:#708096;line-height:1.5;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{border:1px solid #e3eaf2;border-radius:18px;background:white;box-shadow:0 5px 20px #1c365408;text-align:left;padding:20px;min-height:188px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;color:inherit;font:inherit}.tile:active{transform:scale(.985)}.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:#e9f1fc;color:#174b86;font-size:24px;margin-bottom:21px}.tile strong{font-size:17px;line-height:1.2;margin-bottom:8px}.tile small{color:#718299;font-size:13px;line-height:1.4}.back{border:0;background:transparent;color:#205f9f;font-size:15px;font-weight:650;padding:0;margin-bottom:24px;cursor:pointer}.panel{background:#fff;border:1px solid #e3eaf2;border-radius:18px;padding:22px}.panel h3{margin:0 0 8px}.panel p{margin:0}.muted{opacity:.6;cursor:default}.footer{font-size:12px;color:#9aa7b7;margin-top:30px}@media(max-width:430px){.grid{grid-template-columns:1fr}.tile{min-height:150px}.ico{margin-bottom:13px}h2{font-size:25px}}</style></head><body><header><div class="brand"><div class="mark">TP</div><h1>Teacher's Pet</h1></div><span style="font-size:12px;color:#8796a9">Dashboard</span></header><main id="app"></main><script>const app=document.getElementById('app');let page='home';function tile(icon,title,desc,to,disabled=false){return `<button class="tile ${disabled?'muted':''}" ${disabled?'disabled':''} onclick="navigate('${to}')"><span class="ico">${icon}</span><strong>${title}</strong><small>${desc}</small></button>`}function navigate(to){page=to;render();window.scrollTo(0,0)}function render(){if(page==='home'){app.innerHTML=`<div class="eyebrow">Your workspace</div><h2>Dashboard</h2><p>Select a tool to get started.</p><div class="grid">${tile('▦','Student Class Allocator','Organise students into classes.','allocator')}${tile('▤','Student Assessment Tool','Assessments, records and progress tools.','assessment')}</div><div class="footer">Teacher’s Pet · Version 0.1</div>`}else if(page==='allocator'){app.innerHTML=`<button class="back" onclick="navigate('home')">‹ Dashboard</button><div class="eyebrow">Student management</div><h2>Student Class Allocator</h2><p>Class allocation workspace</p><div class="panel"><h3>Ready to build</h3><p>We’ll add the class allocation process here, including your preferred rules and student information.</p></div>`}else if(page==='assessment'){app.innerHTML=`<button class="back" onclick="navigate('home')">‹ Dashboard</button><div class="eyebrow">Student learning</div><h2>Student Assessment Tool</h2><p>Assessment dashboard</p><div class="grid">${tile('＋','Assessment modules','Additional assessment tiles will appear here.','assessment',true)}</div>`}}render();</script></body></html>
