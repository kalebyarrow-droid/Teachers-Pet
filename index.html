<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>Teacher's Pet</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#192b42;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e6ebf1;padding:18px max(20px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0;letter-spacing:-.5px}.mark{width:36px;height:36px;border-radius:11px;background:#173d65;color:#fff;display:grid;place-items:center;font-weight:800}.brand{display:flex;align-items:center;gap:12px}main{max-width:850px;margin:auto;padding:25px 18px 80px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.3px;color:#687c93;text-transform:uppercase;margin-bottom:7px}h2{font-size:28px;letter-spacing:-.8px;margin:0 0 7px}p{color:#708096;line-height:1.5;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{border:1px solid #e3eaf2;border-radius:18px;background:white;box-shadow:0 5px 20px #1c365408;text-align:left;padding:20px;min-height:188px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;color:inherit;font:inherit}.tile:active{transform:scale(.985)}.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:#e9f1fc;color:#174b86;font-size:24px;margin-bottom:21px}.tile strong{font-size:17px;line-height:1.2;margin-bottom:8px}.tile small{color:#718299;font-size:13px;line-height:1.4}.back{border:0;background:transparent;color:#205f9f;font-size:15px;font-weight:650;padding:0;margin-bottom:24px;cursor:pointer}.panel{background:#fff;border:1px solid #e3eaf2;border-radius:18px;padding:22px}.panel h3{margin:0 0 8px}.panel p{margin:0}.muted{opacity:.6;cursor:default}.footer{font-size:12px;color:#9aa7b7;margin-top:30px}@media(max-width:430px){.grid{grid-template-columns:1fr}.tile{min-height:150px}.ico{margin-bottom:13px}h2{font-size:25px}} .primary{background:#175c9d;color:white;border:0;border-radius:13px;padding:15px 20px;font-size:16px;font-weight:750;cursor:pointer}.secondary{background:#edf3fa;color:#19466f;border:0;border-radius:13px;padding:14px 18px;font-size:15px;font-weight:700;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.field{display:block;font-size:13px;font-weight:700;margin:18px 0 8px}.entry{border:1px solid #ccd8e6;border-radius:12px;padding:13px;width:100%;font:inherit}.bigletter{font-size:clamp(100px,28vw,190px);font-weight:800;text-align:center;line-height:1.1;color:#153c65;margin:15px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.choice{min-height:clamp(135px,31vh,240px);font-size:clamp(65px,17vw,130px);font-weight:750;color:#123d67;border:2px solid #dbe6f2;border-radius:22px;background:white;cursor:pointer}.choice:active{background:#dcecff}.progress{height:8px;border-radius:8px;background:#e4ebf3;overflow:hidden;margin:15px 0 24px}.progress>div{height:100%;background:#1c75bb}.resultrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f4}.good{color:#13754d}.bad{color:#b64242}.note{font-size:13px;color:#687c93;margin-top:15px}.hidden-header header{display:none}.hidden-header main{padding-top:15px}.questioncount{text-align:center;color:#708096;font-size:14px;font-weight:650}.studenttitle{text-align:center;font-size:22px;margin-top:10px}@media(max-width:430px){.choices{gap:8px}.choice{min-height:175px}} </style></head><body><header><div class="brand"><div class="mark">TP</div><h1>Teacher's Pet</h1></div><span style="font-size:12px;color:#8796a9">Dashboard</span></header><main id="app"></main><script>
const app=document.getElementById('app');let page='home',session=null,questionIndex=0,results=[],pending=null;
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const soundNames={A:'short a, as in apple',B:'b, as in ball',C:'hard c, as in cat',D:'d, as in dog',E:'short e, as in egg',F:'f, as in fish',G:'hard g, as in goat',H:'h, as in hat',I:'short i, as in insect',J:'j, as in jam',K:'k, as in kite',L:'l, as in lion',M:'m, as in moon',N:'n, as in nest',O:'short o, as in octopus',P:'p, as in pig',Q:'qu, as in queen',R:'r, as in red',S:'s, as in sun',T:'t, as in tap',U:'short u, as in umbrella',V:'v, as in van',W:'w, as in wet',X:'ks, as in box',Y:'y, as in yes',Z:'z, as in zip'};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tile(icon,title,desc,to,disabled=false){return `<button class="tile ${disabled?'muted':''}" ${disabled?'disabled':''} onclick="navigate('${to}')"><span class="ico">${icon}</span><strong>${title}</strong><small>${desc}</small></button>`}
function navigate(to){page=to;document.body.classList.toggle('hidden-header',page==='student');render();window.scrollTo(0,0)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function startAssessment(){const name=document.getElementById('studentName').value.trim();session={name,order:shuffle(letters),date:new Date().toISOString()};questionIndex=0;results=[];pending=null;navigate('teacher')}
function current(){return session.order[questionIndex]}
function optionsFor(letter){const wrong=shuffle(letters.filter(x=>x!==letter)).slice(0,2);return shuffle([letter,...wrong])}
function studentReady(){pending=optionsFor(current());navigate('student')}
function answer(letter){if(page!=='student'||!pending)return;const target=current();results.push({letter:target,selected:letter,correct:letter===target});pending=null;questionIndex++;navigate(questionIndex===26?'results':'teacher')}
function reset(){if(!confirm('End this assessment? Unsaved results will be lost.'))return;session=null;results=[];navigate('assessment')}
function csv(){const rows=[['Student','Date','Letter','Selected','Correct'],...results.map(r=>[session.name,session.date.slice(0,10),r.letter,r.selected,r.correct?'Yes':'No'])];return rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportCSV(){const blob=new Blob([csv()],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='teachers-pet-letter-sounds-'+session.date.slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function render(){if(page==='home'){app.innerHTML=`<div class="eyebrow">Your workspace</div><h2>Dashboard</h2><p>Select a tool to get started.</p><div class="grid">${tile('▦','Student Class Allocator','Organise students into classes.','allocator')}${tile('▤','Student Assessment Tool','Assessments, records and progress tools.','assessment')}</div><div class="footer">Teacher’s Pet · Version 0.2</div>`}
else if(page==='allocator'){app.innerHTML=`<button class="back" onclick="navigate('home')">‹ Dashboard</button><div class="eyebrow">Student management</div><h2>Student Class Allocator</h2><p>Class allocation workspace</p><div class="panel"><h3>Ready to build</h3><p>We’ll add the class allocation process here, including your preferred rules and student information.</p></div>`}
else if(page==='assessment'){app.innerHTML=`<button class="back" onclick="navigate('home')">‹ Dashboard</button><div class="eyebrow">Student learning</div><h2>Student Assessment Tool</h2><p>Choose an assessment.</p><div class="grid">${tile('Aa','Letter–Sound Recognition','Match spoken letter sounds to the correct letters.','setup')}${tile('＋','More assessments','Additional assessment tools will appear here.','assessment',true)}</div>`}
else if(page==='setup'){app.innerHTML=`<button class="back" onclick="navigate('assessment')">‹ Assessments</button><div class="eyebrow">Assessment 01</div><h2>Letter–Sound Recognition</h2><p>26 randomly ordered questions. Each question has three letter choices.</p><div class="panel"><h3>Teacher setup</h3><label class="field" for="studentName">Student name or identifier (optional)</label><input class="entry" id="studentName" autocomplete="off" placeholder="Student name / ID"><p class="note">For privacy, use an identifier rather than a full name if preferred. Results remain in this session until exported.</p><div class="actions"><button class="primary" onclick="startAssessment()">Start assessment</button></div></div>`}
else if(page==='teacher'){const letter=current();app.innerHTML=`<div class="eyebrow">Teacher only · Question ${questionIndex+1} of 26</div><h2>Read the sound aloud</h2><div class="progress"><div style="width:${questionIndex/26*100}%"></div></div><div class="panel"><p>Ask the student:</p><h2>“Which letter makes the <strong>/${letter.toLowerCase()}/</strong> sound?”</h2><p>Pronunciation guide: <strong>${soundNames[letter]}</strong>.</p><div class="bigletter">${letter}</div><p class="note">For vowel letters, use the sound in the example word. Avoid saying the letter name. The student must not see this screen.</p><div class="actions"><button class="primary" onclick="studentReady()">Show student choices →</button><button class="secondary" onclick="reset()">End assessment</button></div></div>`}
else if(page==='student'){app.innerHTML=`<div class="questioncount">Question ${questionIndex+1} of 26</div><div class="progress"><div style="width:${questionIndex/26*100}%"></div></div><h2 class="studenttitle">Touch the letter that makes the sound</h2><div class="choices">${pending.map(letter=>`<button class="choice" aria-label="Letter ${letter}" onclick="answer('${letter}')">${letter}</button>`).join('')}</div><p class="note" style="text-align:center">Choose one letter.</p>`}
else if(page==='results'){const score=results.filter(r=>r.correct).length;app.innerHTML=`<div class="eyebrow">Teacher only · Completed</div><h2>Assessment results</h2><p>${session.name?escapeHTML(session.name)+' · ':''}${new Date(session.date).toLocaleDateString('en-AU')}</p><div class="panel"><h2 style="font-size:42px">${score} / 26</h2><p>${Math.round(score/26*100)}% correct</p><h3>Letter-by-letter results</h3>${results.map((r,i)=>`<div class="resultrow"><span>${i+1}. <strong>${r.letter}</strong> ${r.correct?'':'· selected '+r.selected}</span><strong class="${r.correct?'good':'bad'}">${r.correct?'✓ Correct':'✕ Incorrect'}</strong></div>`).join('')}<div class="actions"><button class="primary" onclick="exportCSV()">Export results (CSV)</button><button class="secondary" onclick="navigate('setup')">New assessment</button><button class="secondary" onclick="navigate('assessment')">Assessments</button></div><p class="note">Results are not uploaded or saved automatically. Export before closing or starting a new assessment.</p></div>`}}
render();
</script></body></html>
