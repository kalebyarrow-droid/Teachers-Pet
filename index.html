<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>Teacher's Pet</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#192b42;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e6ebf1;padding:18px max(20px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0;letter-spacing:-.5px}.mark{width:36px;height:36px;border-radius:11px;background:#173d65;color:#fff;display:grid;place-items:center;font-weight:800}.brand{display:flex;align-items:center;gap:12px}main{max-width:850px;margin:auto;padding:25px 18px 80px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.3px;color:#687c93;text-transform:uppercase;margin-bottom:7px}h2{font-size:28px;letter-spacing:-.8px;margin:0 0 7px}p{color:#708096;line-height:1.5;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{border:1px solid #e3eaf2;border-radius:18px;background:white;box-shadow:0 5px 20px #1c365408;text-align:left;padding:20px;min-height:188px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;color:inherit;font:inherit}.tile:active{transform:scale(.985)}.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:#e9f1fc;color:#174b86;font-size:24px;margin-bottom:21px}.tile strong{font-size:17px;line-height:1.2;margin-bottom:8px}.tile small{color:#718299;font-size:13px;line-height:1.4}.back{border:0;background:transparent;color:#205f9f;font-size:15px;font-weight:650;padding:0;margin-bottom:24px;cursor:pointer}.panel{background:#fff;border:1px solid #e3eaf2;border-radius:18px;padding:22px}.panel h3{margin:0 0 8px}.panel p{margin:0}.muted{opacity:.6;cursor:default}.footer{font-size:12px;color:#9aa7b7;margin-top:30px}@media(max-width:430px){.grid{grid-template-columns:1fr}.tile{min-height:150px}.ico{margin-bottom:13px}h2{font-size:25px}} .primary{background:#175c9d;color:white;border:0;border-radius:13px;padding:15px 20px;font-size:16px;font-weight:750;cursor:pointer}.secondary{background:#edf3fa;color:#19466f;border:0;border-radius:13px;padding:14px 18px;font-size:15px;font-weight:700;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.field{display:block;font-size:13px;font-weight:700;margin:18px 0 8px}.entry{border:1px solid #ccd8e6;border-radius:12px;padding:13px;width:100%;font:inherit}.bigletter{font-size:clamp(100px,28vw,190px);font-weight:800;text-align:center;line-height:1.1;color:#153c65;margin:15px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.choice{min-height:clamp(135px,31vh,240px);font-size:clamp(65px,17vw,130px);font-weight:750;color:#123d67;border:2px solid #dbe6f2;border-radius:22px;background:white;cursor:pointer}.choice:active{background:#dcecff}.progress{height:8px;border-radius:8px;background:#e4ebf3;overflow:hidden;margin:15px 0 24px}.progress>div{height:100%;background:#1c75bb}.resultrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f4}.good{color:#13754d}.bad{color:#b64242}.note{font-size:13px;color:#687c93;margin-top:15px}.hidden-header header{display:none}.hidden-header main{padding-top:15px}.questioncount{text-align:center;color:#708096;font-size:14px;font-weight:650}.studenttitle{text-align:center;font-size:22px;margin-top:10px}.repeat{display:block;margin:20px auto 0;min-height:64px;font-size:19px}.finish{text-align:center;padding:60px 10px}.finish .ico{margin:0 auto 24px}.choice:disabled{opacity:.65;pointer-events:none}@media(max-width:430px){.choices{gap:8px}.choice{min-height:175px}} /* Student-only immersive layout */
body.hidden-header{background:#f5f7fb}body.hidden-header main{max-width:none;width:100%;height:100dvh;min-height:100svh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column}body.hidden-header .questioncount{flex:none}body.hidden-header .progress{flex:none;margin:9px 0 12px}body.hidden-header .studenttitle{flex:none;margin:5px 0 12px;font-size:clamp(19px,4vw,28px)}body.hidden-header .choices{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,20px);margin:10px 0 0}body.hidden-header .choice{height:100%;min-height:0;width:100%;font-family:'SA Beginner','South Australian Beginner','Sassoon Primary','Comic Sans MS',sans-serif;font-weight:400;font-size:clamp(110px,24vw,340px);line-height:1;border-radius:24px}body.hidden-header .repeat{flex:none;margin:5px auto 0}body.hidden-header .note{flex:none;margin:10px 0 0;font-size:12px}@media(max-width:600px){body.hidden-header .choices{gap:7px}body.hidden-header .choice{font-size:clamp(72px,25vw,170px);border-radius:15px}}@media(max-width:360px){body.hidden-header .studenttitle{font-size:18px}body.hidden-header .repeat{min-height:50px;padding:9px 12px}}
.choices{width:100%;max-width:1000px;margin-left:auto;margin-right:auto;align-items:center}.choice{width:100%;aspect-ratio:1/1;min-height:0!important;border-radius:30%;font-size:clamp(65px,16vw,150px)}@media(max-width:430px){.choice{border-radius:28%;font-size:clamp(62px,20vw,110px)}}  .tile{min-height:145px}.tile .ico{margin-bottom:14px}.record-status{color:#708096;margin:10px 0 18px}.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.record-item{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #e3eaf2;border-radius:15px;padding:10px}.record-letter{font-size:38px;width:42px;text-align:center}.record-item .secondary{padding:10px;font-size:13px;flex:1}.record-item .secondary:disabled{opacity:.3}.delete-record{border:0;background:transparent;font-size:24px;color:#9aa7b7}.delete-record:disabled{opacity:.25}@media(max-width:580px){.record-grid{grid-template-columns:1fr}} </style></head><body><header><div class="brand"><div class="mark">TP</div><h1>Teacher's Pet</h1></div><span style="font-size:12px;color:#8796a9">Dashboard</span></header><main id="app"></main><script>
const app=document.getElementById('app');
const DB_NAME='teachers-pet-phonemes';let db=null,recordedLetters=new Set(),recorder=null,recordStream=null,recordChunks=[],recordingLetter=null,activeAudio=null,audioSerial=0;
function stopAudio(){audioSerial++;if(window.speechSynthesis)window.speechSynthesis.cancel();if(activeAudio){activeAudio.pause();activeAudio.src='';activeAudio=null}}
function openAudioDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('sounds');r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
function soundStore(mode='readonly'){return db.transaction('sounds',mode).objectStore('sounds')}
function dbGet(k){return new Promise((resolve,reject)=>{const r=soundStore().get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbPut(k,v){return new Promise((resolve,reject)=>{const r=soundStore('readwrite').put(v,k);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function dbDelete(k){return new Promise((resolve,reject)=>{const r=soundStore('readwrite').delete(k);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function loadRecordings(){try{await openAudioDB();const keys=await new Promise((resolve,reject)=>{const r=soundStore().getAllKeys();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});recordedLetters=new Set(keys);if(page==='recordings'||page==='setup')render()}catch(e){console.warn('Recording storage unavailable',e)}}
function recordedCount(){return letters.filter(l=>recordedLetters.has(l)).length}
function displayLetter(l){return l==='q'?'qu':l}
function recordMsg(t){const el=document.getElementById('recordMessage');if(el)el.textContent=t}
async function playRecording(letter){try{if(!db)return;stopAudio();const blob=await dbGet(letter);if(!blob)return;const url=URL.createObjectURL(blob);const a=new Audio(url);activeAudio=a;a.onended=()=>{URL.revokeObjectURL(url);if(activeAudio===a)activeAudio=null};a.onerror=()=>{URL.revokeObjectURL(url)};await a.play()}catch(e){recordMsg('Audio could not play. Tap Play again.')}}
async function toggleRecording(letter){if(recordingLetter){if(recordingLetter===letter&&recorder?.state==='recording'){recorder.stop();return}recordMsg('Stop the current recording first.');return}try{if(!db)await loadRecordings();if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Microphone recording is not supported in this browser.');stopAudio();recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(recordStream);recordChunks=[];recordingLetter=letter;recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{const savedLetter=recordingLetter;try{const blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/mp4'});if(blob.size<100)throw Error('Recording too short');await dbPut(savedLetter,blob);recordedLetters.add(savedLetter);recordMsg(savedLetter+' saved.')}catch(e){recordMsg('Could not save recording: '+e.message)}finally{recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;recorder=null;recordingLetter=null;render()}};recorder.start();render();recordMsg('Recording '+letter+' — tap Stop when finished.')}catch(e){recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;recordingLetter=null;recordMsg(e.message)}}
async function deleteRecording(letter){if(!db)return;await dbDelete(letter);recordedLetters.delete(letter);render()}
const VOICE_KEY='tp_voice_preset';let voicePreset=Number(localStorage.getItem(VOICE_KEY)||5);let availableVoices=[];function loadVoices(){availableVoices=window.speechSynthesis?window.speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en')):[]}if(window.speechSynthesis){loadVoices();window.speechSynthesis.addEventListener('voiceschanged',loadVoices)}const voicePresets=[{label:'Male 1 · Natural',pitch:.78,rate:.78},{label:'Male 2 · Gentle',pitch:.85,rate:.68},{label:'Male 3 · Clear',pitch:.75,rate:.88},{label:'Male 4 · Deep',pitch:.60,rate:.73},{label:'Male 5 · Bright',pitch:.95,rate:.84},{label:'Female 1 · Natural',pitch:1,rate:.92},{label:'Female 2 · Gentle',pitch:1.24,rate:.68},{label:'Female 3 · Clear',pitch:1.12,rate:.88},{label:'Female 4 · Warm',pitch:1.06,rate:.73},{label:'Female 5 · Bright',pitch:1.36,rate:.84}];function chooseVoice(){const au=availableVoices.filter(v=>v.lang.toLowerCase()==='en-au');const pool=au.length?au:availableVoices;const natural=pool.find(v=>/karen|catherine|matilda|female|premium|enhanced/i.test(v.name));return voicePreset===5?(natural||pool[0]||null):(pool.length?pool[voicePreset%pool.length]:null)}function selectVoice(n){voicePreset=Number(n);localStorage.setItem(VOICE_KEY,String(voicePreset));document.getElementById('voiceInfo').textContent=voiceInfo();}function voiceInfo(){const v=chooseVoice();return v?'Device voice: '+v.name+'. Pitch and pace adjusted for the selected style.':'Uses the device default voice, with adjusted pitch and pace.'}function previewVoice(){const u=new SpeechSynthesisUtterance('What letter makes the sound? Sss.');const v=chooseVoice();if(v)u.voice=v;u.lang=v?v.lang:'en-AU';u.rate=voicePresets[voicePreset].rate;u.pitch=voicePresets[voicePreset].pitch;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)};let page='home',session=null,questionIndex=0,results=[],pending=null,locked=false,advanceTimer=null;
const RECORDS_KEY='tp_letter_sound_results_v1';let savedRecords=[];try{savedRecords=JSON.parse(localStorage.getItem(RECORDS_KEY)||'[]');if(!Array.isArray(savedRecords))savedRecords=[]}catch(e){savedRecords=[]}let activeRecord=null;
function storeCompleted(){if(!session||results.length!==26)return;activeRecord={id:session.date,name:session.name,date:session.date,answers:results.map(r=>({...r}))};if(session.name){savedRecords=savedRecords.filter(r=>r.id!==activeRecord.id);savedRecords.unshift(activeRecord);try{localStorage.setItem(RECORDS_KEY,JSON.stringify(savedRecords))}catch(e){alert('Unable to save results on this device. Please export a CSV.')}}}
function viewRecord(id){activeRecord=id==='latest'?activeRecord:savedRecords.find(r=>r.id===id);if(activeRecord)navigate('results')}
function deleteRecord(id){if(!confirm('Delete this saved assessment?'))return;savedRecords=savedRecords.filter(r=>r.id!==id);localStorage.setItem(RECORDS_KEY,JSON.stringify(savedRecords));navigate('records')}
function currentResult(){return activeRecord||{name:session?.name||'',date:session?.date||new Date().toISOString(),answers:results}};
const letters='abcdefghijklmnopqrstuvwxyz'.split('');
const soundNames={A:'short a, as in apple',B:'b, as in ball',C:'hard c, as in cat',D:'d, as in dog',E:'short e, as in egg',F:'f, as in fish',G:'hard g, as in goat',H:'h, as in hat',I:'short i, as in insect',J:'j, as in jam',K:'k, as in kite',L:'l, as in lion',M:'m, as in moon',N:'n, as in nest',O:'short o, as in octopus',P:'p, as in pig',Q:'qu, as in queen',R:'r, as in red',S:'s, as in sun',T:'t, as in tap',U:'short u, as in umbrella',V:'v, as in van',W:'w, as in wet',X:'ks, as in box',Y:'y, as in yes',Z:'z, as in zip'};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tile(icon,title,desc,to,disabled=false){return `<button class="tile ${disabled?'muted':''}" ${disabled?'disabled':''} onclick="navigate('${to}')"><span class="ico">${icon}</span><strong>${title}</strong></button>`}
function navigate(to){stopAudio();page=to;document.body.classList.toggle('hidden-header',page==='student');render();window.scrollTo(0,0)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function startAssessment(){const missing=letters.filter(l=>!recordedLetters.has(l));if(missing.length){alert('Please record the remaining sounds: '+missing.map(displayLetter).join(', '));navigate('recordings');return}const name=document.getElementById('studentName').value.trim();session={name,order:shuffle(letters),date:new Date().toISOString()};activeRecord=null;questionIndex=0;results=[];pending=optionsFor(current());locked=false;navigate('student');setTimeout(()=>{if(page==='student')speakQuestion()},250)}
function current(){return session.order[questionIndex]}
function optionsFor(letter){const wrong=shuffle(letters.filter(x=>x!==letter)).slice(0,2);return shuffle([letter,...wrong])}
const soundWords={A:'apple',B:'ball',C:'cat',D:'dog',E:'egg',F:'fish',G:'goat',H:'hat',I:'insect',J:'jam',K:'kite',L:'lion',M:'moon',N:'nest',O:'octopus',P:'pig',Q:'queen',R:'red',S:'sun',T:'tap',U:'umbrella',V:'van',W:'wet',X:'box',Y:'yes',Z:'zip'};
const phonemes={a:'aah',b:'buh',c:'kuh',d:'duh',e:'eh',f:'fff',g:'guh',h:'hhh',i:'ih',j:'juh',k:'kuh',l:'lll',m:'mmm',n:'nnn',o:'aw',p:'puh',q:'kwuh',r:'rrr',s:'sss',t:'tuh',u:'uh',v:'vvv',w:'wuh',x:'kss',y:'yuh',z:'zzz'};
async function playClip(key,serial){if(serial!==audioSerial||page!=='student')return false;try{const blob=await dbGet(key);if(!blob)return false;const url=URL.createObjectURL(blob);const a=new Audio(url);activeAudio=a;return await new Promise(resolve=>{let done=false;function finish(ok){if(done)return;done=true;URL.revokeObjectURL(url);if(activeAudio===a)activeAudio=null;resolve(ok)}a.onended=()=>finish(true);a.onerror=()=>finish(false);a.onpause=()=>finish(false);a.play().catch(()=>finish(false))})}catch(e){return false}}
async function speakQuestion(){if(!session||page!=='student')return;stopAudio();const serial=audioSerial;await playClip(current(),serial)}

function prepareQuestion(){pending=optionsFor(current());locked=false;render();setTimeout(()=>{if(page==='student')speakQuestion()},250)}
function answer(letter){if(page!=='student'||!pending||locked)return;stopAudio();locked=true;const target=current();results.push({letter:target,selected:letter,correct:letter===target});document.querySelectorAll('.choice').forEach(b=>b.disabled=true);pending=null;questionIndex++;advanceTimer=setTimeout(()=>{advanceTimer=null;if(questionIndex===26){storeCompleted();navigate('finished')}else prepareQuestion()},550)}
let revealTimer=null;
function revealStart(){revealTimer=setTimeout(()=>{revealTimer=null;navigate('results')},1800)}
function revealCancel(){if(revealTimer){clearTimeout(revealTimer);revealTimer=null}}
function reset(){revealCancel();if(advanceTimer)clearTimeout(advanceTimer);if(!confirm('End this assessment? Unsaved results will be lost.'))return;session=null;results=[];navigate('assessment')}
function csv(){const record=currentResult();const rows=[['Student','Date','Letter','Selected','Correct'],...record.answers.map(r=>[record.name,record.date.slice(0,10),displayLetter(r.letter),displayLetter(r.selected),r.correct?'Yes':'No'])];return rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportCSV(){const blob=new Blob([csv()],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='teachers-pet-letter-sounds-'+currentResult().date.slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function render(){if(page==='home'){app.innerHTML=`<div class="eyebrow">Your workspace</div><h2>Dashboard</h2><div class="grid">${tile('▦','Student Class Allocator','Organise students into classes.','allocator')}${tile('▤','Student Assessment Tool','Assessments, records and progress tools.','assessment')}</div><div class="footer">Teacher’s Pet · Version 1.0</div>`}
else if(page==='allocator'){app.innerHTML=`<button class="back" onclick="navigate('home')">‹ Dashboard</button><div class="eyebrow">Student management</div><h2>Student Class Allocator</h2><div class="panel"><h3>Ready to build</h3><p>We’ll add the class allocation process here, including your preferred rules and student information.</p></div>`}
else if(page==='assessment'){app.innerHTML=`<button class="back" onclick="navigate('home')">‹ Dashboard</button><div class="eyebrow">Student learning</div><h2>Student Assessment Tool</h2><div class="grid">${tile('Aa','Letter–Sound Recognition','','setup')}${tile('▤','Assessment Results','','records')}${tile('＋','More assessments','Additional assessment tools will appear here.','assessment',true)}</div>`}
else if(page==='setup'){app.innerHTML=`<button class="back" onclick="navigate('assessment')">‹ Assessments</button><div class="eyebrow">Assessment 01</div><h2>Letter–Sound Recognition</h2><div class="panel"><h3>Teacher setup</h3><label class="field" for="studentName">Student name or identifier (optional)</label><input class="entry" id="studentName" autocomplete="off" placeholder="Student name / ID"><div class="actions"><button class="secondary" onclick="navigate('records')">View results</button><button class="secondary" onclick="navigate('recordings')">🎙 Record phonemes <span id="recordCount">(${recordedCount()}/26)</span></button></div><p class="note">Record each complete question before starting.</p><div class="actions"><button class="primary" onclick="startAssessment()">Start spoken assessment</button></div></div>`}
else if(page==='records'){app.innerHTML=`<button class="back" onclick="navigate('assessment')">‹ Assessments</button><h2>Letter–Sound Results</h2>${activeRecord&&!activeRecord.name?`<div class="panel"><div class="resultrow"><strong>Latest assessment · Not saved</strong><button class="secondary" onclick="viewRecord('latest')">View</button></div></div>`:''}<div class="panel">${savedRecords.length?savedRecords.map(r=>`<div class="resultrow"><span><strong>${escapeHTML(r.name)}</strong><br><small>${new Date(r.date).toLocaleDateString('en-AU')} · ${r.answers.filter(a=>a.correct).length}/26</small></span><span><button class="secondary" onclick="viewRecord('${r.id}')">View</button> <button class="secondary" onclick="deleteRecord('${r.id}')" aria-label="Delete result">×</button></span></div>`).join(''):'No named assessments saved yet.'}</div>`}
else if(page==='recordings'){app.innerHTML=`<button class="back" onclick="navigate('setup')">‹ Assessment setup</button><h2>Record phonemes</h2><div class="record-status">${recordedCount()} of 26 saved on this device</div><div class="record-grid">${letters.map(l=>`<div class="record-item"><span class="record-letter">${displayLetter(l)}</span><button class="secondary" id="rec-${l}" onclick="toggleRecording('${l}')">${recordingLetter===l?'■ Stop':recordedLetters.has(l)?'↻ Replace':'● Record'}</button><button class="secondary" onclick="playRecording('${l}')" ${recordedLetters.has(l)?'':'disabled'}>▶</button><button class="delete-record" onclick="deleteRecording('${l}')" ${recordedLetters.has(l)?'':'disabled'} aria-label="Delete ${l}">×</button></div>`).join('')}</div><p class="note" id="recordMessage">Record the full question and sound for each letter, for example “What letter makes the sound … mmm?”</p>`}
else if(page==='teacher'){const letter=current();app.innerHTML=`<div class="eyebrow">Teacher only · Question ${questionIndex+1} of 26</div><h2>Read the sound aloud</h2><div class="progress"><div style="width:${questionIndex/26*100}%"></div></div><div class="panel"><p>Ask the student:</p><h2>“Which letter makes the <strong>/${letter.toLowerCase()}/</strong> sound?”</h2><p>Pronunciation guide: <strong>${soundNames[letter]}</strong>.</p><div class="bigletter">${letter}</div><p class="note">For vowel letters, use the sound in the example word. Avoid saying the letter name. The student must not see this screen.</p><div class="actions"><button class="primary" onclick="studentReady()">Show student choices →</button><button class="secondary" onclick="reset()">End assessment</button></div></div>`}
else if(page==='student'){app.innerHTML=`<div class="questioncount">Question ${questionIndex+1} of 26</div><div class="progress"><div style="width:${questionIndex/26*100}%"></div></div><h2 class="studenttitle">Listen and choose</h2><button class="secondary repeat" onclick="speakQuestion()">🔊 Repeat sound</button><div class="choices">${pending.map(letter=>`<button class="choice" aria-label="Letter ${letter}" onclick="answer('${letter}')">${displayLetter(letter)}</button>`).join('')}</div>`}
else if(page==='finished'){app.innerHTML=`<div class="finish"><div class="ico" style="font-size:30px">★</div><h2>Great work!</h2><p>Please give the device back to your teacher.</p><div style="margin-top:50px"><button class="secondary" onclick="navigate('records')">Assessment results</button><button class="secondary" style="touch-action:none" onpointerdown="revealStart()" onpointerup="revealCancel()" onpointercancel="revealCancel()" onpointerleave="revealCancel()" oncontextmenu="event.preventDefault()">Teacher: hold to view results</button></div></div>`}
else if(page==='results'){const record=currentResult(),score=record.answers.filter(r=>r.correct).length;app.innerHTML=`<button class="back" onclick="navigate('records')">‹ Assessment results</button><div class="eyebrow">Teacher only · Completed</div><h2>Assessment results</h2><p>${record.name?escapeHTML(record.name)+' · ':''}${new Date(record.date).toLocaleDateString('en-AU')}</p><div class="panel"><h2 style="font-size:42px">${score} / 26</h2><p>${Math.round(score/26*100)}% correct</p><h3>Letter-by-letter results</h3>${record.answers.map((r,i)=>`<div class="resultrow"><span>${i+1}. <strong>${displayLetter(r.letter)}</strong> ${r.correct?'':'· selected '+displayLetter(r.selected)}</span><strong class="${r.correct?'good':'bad'}">${r.correct?'✓ Correct':'✕ Incorrect'}</strong></div>`).join('')}<div class="actions"><button class="primary" onclick="exportCSV()">Export results (CSV)</button><button class="secondary" onclick="navigate('setup')">New assessment</button><button class="secondary" onclick="navigate('records')">All results</button></div><p class="note">${record.name?'Saved on this device.':'Unnamed assessment — not saved. Export if needed.'}</p></div>`}}

render();loadRecordings();
</script></body></html>
